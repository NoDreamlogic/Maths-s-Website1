<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章编辑器</title>
<link rel="stylesheet" href="/static/easymde.min.css">
<style>
:root { --border:#e2e2e2; --bg:#fafafa; --accent:#2f6feb; }
* { box-sizing: border-box; }
html, body { height:100%; margin:0; }
body {
  display:flex; flex-direction:column; overflow:hidden;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; color:#222;
}
[hidden] { display:none !important; }

/* ---------- 顶栏 ---------- */
#topbar {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:8px 14px; border-bottom:1px solid var(--border); background:#fff;
}
.brand { font-weight:600; font-size:15px; white-space:nowrap; }
.fields { display:flex; align-items:center; gap:8px; flex:1 1 380px; flex-wrap:wrap; }
.fields input[type=text], .fields input[type=datetime-local] {
  padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:13px;
  font-family:inherit; color:inherit;
}
#f-title { flex:1 1 200px; min-width:140px; font-weight:600; }
#f-tags  { flex:1 1 140px; min-width:120px; }
.chk { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; font-size:13px; cursor:pointer; }
button {
  padding:6px 12px; border:1px solid var(--border); background:#fff; color:#222;
  border-radius:6px; cursor:pointer; font-size:13px; font-family:inherit;
}
button:hover { background:#f2f4f7; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.primary:hover { background:#2359c4; }

/* ---------- 模式切换 ---------- */
.modes { display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; }
.modes button { border:none; border-radius:0; padding:6px 14px; background:#fff; font-weight:600; }
.modes button + button { border-left:1px solid var(--border); }
.modes button.on { background:var(--accent); color:#fff; }
.modes button.on:hover { background:#2359c4; }

/* ---------- 主体 ---------- */
main { flex:1; display:flex; min-height:0; }
#sidebar {
  width:250px; flex:0 0 250px; background:var(--bg);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0;
}
.side-head { display:flex; gap:6px; padding:8px; border-bottom:1px solid var(--border); }
.side-head button { flex:1; }
#post-list { list-style:none; margin:0; padding:6px; overflow-y:auto; flex:1; }
#post-list li {
  padding:8px 10px; border-radius:6px; cursor:pointer;
  border:1px solid transparent; margin-bottom:2px;
}
#post-list li:hover { background:#eef1f5; }
#post-list li.active { background:#e4ecfd; border-color:#b9cdf7; }
#post-list li .t { display:block; font-weight:600; font-size:13px; word-break:break-all; }
#post-list li .m { display:block; font-size:11px; color:#888; margin-top:3px; word-break:break-all; }
.badge {
  display:inline-block; border-radius:3px; padding:0 4px; margin-left:4px;
  font-size:10px; vertical-align:middle; font-weight:400;
}
.badge.draft { background:#ffe7ba; color:#8a5a00; }
.badge.dlg { background:#dbe7ff; color:#1c4fa8; }
.empty { padding:16px; color:#999; font-size:12px; line-height:1.7; }

/* ---------- 编辑区 ---------- */
#editor-area { flex:1; display:flex; min-width:0; min-height:0; }
#editor-pane { position:relative; flex:1 1 50%; min-width:0; border-right:1px solid var(--border); }
#normal-mode { position:absolute; inset:0; }
#normal-mode > .EasyMDEContainer:not(.fullscreen) {
  position:absolute; top:0; right:0; bottom:0; left:0;
  display:flex; flex-direction:column;
}
#normal-mode .CodeMirror { flex:1 1 auto; height:auto; min-height:0; font-size:14px; }
#preview-pane { flex:1 1 50%; min-width:0; overflow-y:auto; padding:18px 24px; background:#fff; }
body.no-preview #preview-pane { display:none; }
body.no-preview #editor-pane { flex:1 1 100%; border-right:none; }

/* ---------- 对话体编辑 ---------- */
#dialogue-mode { position:absolute; inset:0; display:flex; flex-direction:column; background:#f7f8fa; }
.dlg-bar {
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:8px 12px; background:#fff; border-bottom:1px solid var(--border);
}
.dlg-bar label { display:flex; align-items:center; gap:6px; font-size:13px; color:#555; }
.dlg-bar input {
  padding:5px 8px; border:1px solid var(--border); border-radius:6px;
  font:inherit; font-size:13px; width:150px;
}
#dlg-stat { font-size:12px; color:#888; }
#blocks { flex:1; overflow-y:auto; padding:12px; }
#blocks-empty { color:#999; font-size:13px; text-align:center; padding:40px 10px; line-height:1.9; }
.blk { border:1px solid #e6e8ec; border-radius:8px; margin-bottom:8px; background:#fff; }
.blk-head {
  display:flex; justify-content:space-between; align-items:center;
  padding:3px 8px; background:#fafbfc; border-bottom:1px solid #f0f1f3;
  border-radius:8px 8px 0 0;
}
.blk-type { font-size:11px; font-weight:600; color:#777; letter-spacing:.04em; }
.blk-line .blk-type { color:#2f6feb; }
.blk-title .blk-type { color:#8a5cd6; }
.blk-tools button { border:none; background:none; padding:2px 6px; color:#aaa; border-radius:4px; }
.blk-tools button:hover { color:#333; background:#eef1f5; }
.blk-body { padding:8px; display:flex; flex-direction:column; gap:6px; }
.blk-body input, .blk-body textarea {
  border:1px solid #e2e5ea; border-radius:6px; padding:6px 8px;
  font:inherit; font-size:13px; color:inherit; background:#fff;
}
.blk-body input:focus, .blk-body textarea:focus {
  outline:2px solid #d7e4ff; outline-offset:-1px; border-color:#9fc0f5;
}
.blk-name { width:150px; font-weight:600; }
.blk-text { resize:none; overflow:hidden; min-height:34px; line-height:1.6; }
.blk-break .blk-body { display:none; }
.blk-image .blk-body { flex-direction:row; flex-wrap:wrap; }
.blk-image input.src { flex:1 1 220px; }
.blk-image input.alt { flex:0 1 160px; }
.dlg-add {
  display:flex; gap:8px; flex-wrap:wrap; padding:8px 12px;
  background:#fff; border-top:1px solid var(--border);
}
.dlg-add button { font-size:12px; padding:5px 10px; }

/* ---------- Markdown 预览 ---------- */
.markdown-body { font-size:15px; line-height:1.75; word-wrap:break-word; }
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4 { margin:1.2em 0 .6em; line-height:1.3; }
.markdown-body h1 { font-size:1.8em; border-bottom:1px solid #eee; padding-bottom:.3em; }
.markdown-body h2 { font-size:1.45em; border-bottom:1px solid #eee; padding-bottom:.3em; }
.markdown-body h3 { font-size:1.2em; }
.markdown-body > :first-child { margin-top:0; }
.markdown-body p { margin:.8em 0; text-indent:2em; }
.markdown-body li p, .markdown-body blockquote p, .markdown-body td p { text-indent:0; }
.markdown-body code { background:#f2f3f5; padding:.15em .35em; border-radius:4px; font-family:Consolas,"Courier New",monospace; font-size:.9em; }
.markdown-body pre { background:#f6f8fa; padding:12px; border-radius:6px; overflow-x:auto; }
.markdown-body pre code { background:none; padding:0; }
.markdown-body blockquote { margin:.8em 0; padding:.3em 1em; color:#666; border-left:4px solid #dfe2e5; background:#fafafa; }
.markdown-body ul,.markdown-body ol { padding-left:1.6em; }
.markdown-body img { max-width:100%; }
.markdown-body a { color:var(--accent); }
.markdown-body table { border-collapse:collapse; margin:.8em 0; }
.markdown-body th,.markdown-body td { border:1px solid #dfe2e5; padding:6px 12px; }
.markdown-body hr { border:none; border-top:1px solid #eee; margin:1.5em 0; }

/* ---------- 聊天预览（与站点 chat.html 一致） ---------- */
.chat {
  --chat-bg:#f3f4f7; --chat-bubble:#fff; --chat-me-bubble:#2f7cf6;
  --chat-quote-line:rgba(0,0,0,.12);
  padding:18px 16px 20px; font-size:15px; background:var(--chat-bg);
  border:1px solid rgba(0,0,0,.06); border-radius:16px; overflow-wrap:anywhere;
}
.chat-msg { display:flex; align-items:flex-start; gap:10px; margin:14px 0; }
.chat-msg.chat-same { margin-top:5px; }
.chat-me { flex-direction:row-reverse; }
.chat-avatar {
  flex:0 0 34px; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:.9em; color:#fff; background:var(--c,#7a7a7a); user-select:none;
}
.chat-same .chat-avatar { visibility:hidden; }
.chat-same .chat-name { display:none; }
.chat-body { max-width:78%; min-width:0; }
.chat-me .chat-body { text-align:right; }
.chat-name { margin:0 0 3px; padding:0 4px; font-size:.75em; color:#888; }
.chat-bubble {
  display:inline-block; padding:8px 12px; text-align:left; line-height:1.7;
  background:var(--chat-bubble); border-radius:13px; border-top-left-radius:4px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.chat-me .chat-bubble {
  color:#fff; background:var(--chat-me-bubble);
  border-top-left-radius:13px; border-top-right-radius:4px;
}
.chat-bubble p { margin:0; }
.chat-bubble a { color:inherit; text-decoration:underline; }
.chat-bubble img { display:block; max-width:100%; border-radius:6px; }
.chat-image .chat-bubble { padding:4px; }
.chat-narration {
  margin:16px 0 16px 44px; padding-left:12px;
  border-left:3px solid var(--chat-quote-line); color:#777; font-size:.94em; line-height:1.85;
}
.chat-narration p { margin:0 0 .5em; }
.chat-narration p:last-child { margin-bottom:0; }
.chat-divider {
  display:flex; align-items:center; gap:12px; margin:24px 0 14px;
  font-size:.8em; letter-spacing:.1em; color:#888;
}
.chat-divider::before, .chat-divider::after { content:""; flex:1; height:1px; background:currentColor; opacity:.18; }
.chat-divider span { white-space:nowrap; }
.chat-empty { color:#999; font-size:13px; text-align:center; padding:40px 10px; line-height:1.9; }

/* ---------- 提示条 ---------- */
#toast {
  position:fixed; left:50%; bottom:28px; z-index:9999;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,30,.92); color:#fff; padding:10px 18px;
  border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
  transition:opacity .22s, transform .22s;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
#toast.error { background:rgba(180,40,40,.94); }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">文章编辑器</div>
  <div class="fields">
    <input id="f-title" type="text" placeholder="文章标题">
    <input id="f-date" type="datetime-local">
    <input id="f-tags" type="text" list="taglist" placeholder="标签，逗号分隔">
  </div>
  <div class="modes">
    <button type="button" class="mode-btn on" data-mode="normal">普通文章</button>
    <button type="button" class="mode-btn" data-mode="dialogue">对话体</button>
  </div>
  <label class="chk"><input id="f-draft" type="checkbox"> 草稿</label>
  <label class="chk"><input id="toggle-preview" type="checkbox" checked> 预览</label>
  <button id="btn-save" class="primary">保存 (Ctrl+S)</button>
</header>

<main>
  <aside id="sidebar">
    <div class="side-head">
      <button id="btn-new">＋ 新建</button>
      <button id="btn-refresh" title="重新读取文章列表">刷新</button>
    </div>
    <ul id="post-list"></ul>
    <div id="list-empty" class="empty">还没有文章，点上面的「＋ 新建」开始吧。</div>
  </aside>

  <section id="editor-area">
    <div id="editor-pane">
      <div id="normal-mode">
        <textarea id="md"></textarea>
      </div>

      <div id="dialogue-mode" hidden>
        <div class="dlg-bar">
          <label>主角（气泡靠右）<input id="f-me" list="chars" placeholder="例如：林致远"></label>
          <span id="dlg-stat"></span>
        </div>
        <div id="blocks"></div>
        <div class="dlg-add">
          <button type="button" data-add="line">＋ 台词</button>
          <button type="button" data-add="narration">＋ 旁白</button>
          <button type="button" data-add="title">＋ 场景标题</button>
          <button type="button" data-add="quote">＋ 引用</button>
          <button type="button" data-add="break">＋ 分隔</button>
          <button type="button" data-add="image">＋ 图片</button>
        </div>
      </div>
    </div>

    <div id="preview-pane">
      <div id="preview"></div>
    </div>
  </section>
</main>

<datalist id="chars"></datalist>
<datalist id="taglist"></datalist>
<div id="toast"></div>

<script src="/static/easymde.min.js"></script>
<script src="/static/marked.min.js"></script>
<script>
(function () {
  "use strict";

  var state = { file: null, mode: "normal", dirty: false, blocks: [], seq: 0 };
  var editor = null;
  var previewTimer = null;

  var TYPE_NAME = {
    line: "台词", narration: "旁白", title: "场景标题",
    quote: "引用", break: "分隔", image: "图片"
  };

  function $(id) { return document.getElementById(id); }

  /* ---------------- 与后端通信 ---------------- */
  var api = {
    list: function () { return fetch("/api/posts").then(handle); },
    tags: function () { return fetch("/api/tags").then(handle); },
    get: function (name) { return fetch("/api/posts/" + encodeURIComponent(name)).then(handle); },
    create: function (payload) {
      return fetch("/api/posts", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
      }).then(handle);
    },
    save: function (name, payload) {
      return fetch("/api/posts/" + encodeURIComponent(name), {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
      }).then(handle);
    }
  };

  function handle(res) {
    if (res.ok) return res.json();
    return res.json().catch(function () { return {}; }).then(function (data) {
      throw new Error(data.error || ("请求失败（" + res.status + "）"));
    });
  }

  /* ---------------- 小工具 ---------------- */
  var toastTimer = null;
  function toast(msg, isError) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.toggle("error", !!isError);
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function toLocalInput(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
      + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function nowLocalInput() { return toLocalInput(new Date()); }
  function isoToLocalInput(iso) {
    if (!iso) return nowLocalInput();
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso).slice(0, 16);
    return toLocalInput(d);
  }

  function markDirty() { state.dirty = true; }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inlineMd(text) {
    var html;
    try {
      html = (typeof marked.parseInline === "function") ? marked.parseInline(text) : escapeHtml(text);
    } catch (e) {
      html = escapeHtml(text);
    }
    return String(html).replace(/\n/g, "<br>");
  }

  function autoSize(el) {
    el.style.height = "auto";
    el.style.height = (el.scrollHeight + 2) + "px";
  }

  /* ---------------- 块模型 ---------------- */
  function newBlock(type) {
    state.seq += 1;
    return { id: "b" + state.seq, type: type, name: "", text: "", src: "", alt: "" };
  }

  function addBlock(type, afterId) {
    var b = newBlock(type);
    var list = state.blocks;
    if (afterId) {
      var i = list.findIndex(function (x) { return x.id === afterId; });
      list.splice(i + 1, 0, b);
    } else {
      list.push(b);
    }
    markDirty();
    renderBlocks();
    var row = document.querySelector('.blk[data-id="' + b.id + '"]');
    if (row) {
      var first = row.querySelector("input, textarea");
      if (first) first.focus();
    }
    schedulePreview();
  }

  function moveBlock(id, dir) {
    var list = state.blocks;
    var i = list.findIndex(function (x) { return x.id === id; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    markDirty();
    renderBlocks();
    schedulePreview();
  }

  function removeBlock(id) {
    state.blocks = state.blocks.filter(function (x) { return x.id !== id; });
    markDirty();
    renderBlocks();
    schedulePreview();
  }

  function field(tag, cls, placeholder) {
    var el = document.createElement(tag);
    el.className = cls;
    if (placeholder) el.placeholder = placeholder;
    return el;
  }

  function renderBlocks() {
    var box = $("blocks");
    box.innerHTML = "";

    if (!state.blocks.length) {
      var hint = document.createElement("div");
      hint.id = "blocks-empty";
      hint.innerHTML = "还没有内容。<br>点下面的「＋ 台词」开始写，或者切到「普通文章」写散文。";
      box.appendChild(hint);
    }

    state.blocks.forEach(function (b) {
      var row = document.createElement("div");
      row.className = "blk blk-" + b.type;
      row.dataset.id = b.id;

      var head = document.createElement("div");
      head.className = "blk-head";
      var label = document.createElement("span");
      label.className = "blk-type";
      label.textContent = TYPE_NAME[b.type] || b.type;
      head.appendChild(label);

      var tools = document.createElement("span");
      tools.className = "blk-tools";
      tools.innerHTML = '<button type="button" data-act="up" title="上移">↑</button>'
        + '<button type="button" data-act="down" title="下移">↓</button>'
        + '<button type="button" data-act="del" title="删除">✕</button>';
      head.appendChild(tools);
      row.appendChild(head);

      var body = document.createElement("div");
      body.className = "blk-body";

      if (b.type === "line") {
        var name = field("input", "blk-name", "角色名");
        name.value = b.name;
        name.setAttribute("list", "chars");
        name.addEventListener("input", function () {
          b.name = name.value; markDirty(); schedulePreview(); refreshChars();
        });
        name.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); var t = row.querySelector(".blk-text"); if (t) t.focus(); }
        });
        body.appendChild(name);

        var ta = field("textarea", "blk-text", "这一句说什么……（Ctrl+Enter 继续下一句）");
        ta.value = b.text;
        ta.addEventListener("input", function () { b.text = ta.value; autoSize(ta); markDirty(); schedulePreview(); });
        ta.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); addBlock("line", b.id); }
        });
        body.appendChild(ta);
        setTimeout(function () { autoSize(ta); }, 0);
      } else if (b.type === "title") {
        var t = field("input", "blk-title-input", "场景标题，例如：场景一 · 雨夜");
        t.value = b.text;
        t.addEventListener("input", function () { b.text = t.value; markDirty(); schedulePreview(); });
        t.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); addBlock("narration", b.id); }
        });
        body.appendChild(t);
      } else if (b.type === "narration" || b.type === "quote") {
        var n = field("textarea", "blk-text", b.type === "quote" ? "引用 / 旁白……" : "旁白……（Ctrl+Enter 继续下一段）");
        n.value = b.text;
        n.addEventListener("input", function () { b.text = n.value; autoSize(n); markDirty(); schedulePreview(); });
        n.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); addBlock(b.type, b.id); }
        });
        body.appendChild(n);
        setTimeout(function () { autoSize(n); }, 0);
      } else if (b.type === "image") {
        var src = field("input", "src", "图片地址，例如 /images/xxx.png");
        src.value = b.src;
        src.addEventListener("input", function () { b.src = src.value; markDirty(); schedulePreview(); });
        var alt = field("input", "alt", "图片说明（可空）");
        alt.value = b.alt;
        alt.addEventListener("input", function () { b.alt = alt.value; markDirty(); schedulePreview(); });
        body.appendChild(src);
        body.appendChild(alt);
      }

      if (b.type !== "break") row.appendChild(body);

      tools.addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) return;
        if (btn.dataset.act === "up") moveBlock(b.id, -1);
        else if (btn.dataset.act === "down") moveBlock(b.id, 1);
        else if (btn.dataset.act === "del") removeBlock(b.id);
      });

      box.appendChild(row);
    });

    updateStat();
    refreshChars();
  }

  function updateStat() {
    var lines = state.blocks.filter(function (b) { return b.type === "line"; }).length;
    var names = [];
    state.blocks.forEach(function (b) {
      if (b.type === "line" && b.name && names.indexOf(b.name) < 0) names.push(b.name);
    });
    $("dlg-stat").textContent = lines
      ? (lines + " 句台词 · 角色：" + names.join("、"))
      : "还没有台词";
  }

  function refreshChars() {
    var names = [];
    state.blocks.forEach(function (b) {
      if (b.type === "line" && b.name && names.indexOf(b.name) < 0) names.push(b.name);
    });
    var dl = $("chars");
    dl.innerHTML = "";
    names.forEach(function (n) {
      var o = document.createElement("option");
      o.value = n;
      dl.appendChild(o);
    });
  }

  /* ---------------- 块 ←→ Markdown ---------------- */
  function blocksToMarkdown() {
    var out = [];
    state.blocks.forEach(function (b) {
      if (b.type === "line") {
        var name = (b.name || "").trim();
        var text = (b.text || "").trim();
        if (!text && !name) return;
        out.push((name || "我") + "：" + text);
      } else if (b.type === "narration") {
        var nt = (b.text || "").trim();
        if (!nt) return;
        // 如果旁白本身以「某某：」开头，加上「旁白：」防止被当成台词
        out.push(/^[^\s：:]{1,10}[：:]/.test(nt) ? "旁白：" + nt : nt);
      } else if (b.type === "quote") {
        var qt = (b.text || "").trim();
        if (!qt) return;
        out.push(qt.split("\n").map(function (l) { return "> " + l; }).join("\n"));
      } else if (b.type === "title") {
        var tt = (b.text || "").trim();
        if (!tt) return;
        out.push("## " + tt);
      } else if (b.type === "break") {
        out.push("---");
      } else if (b.type === "image") {
        if (!(b.src || "").trim()) return;
        out.push("![" + (b.alt || "").trim() + "](" + b.src.trim() + ")");
      }
    });
    return out.join("\n\n");
  }

  function markdownToBlocks(body) {
    var lines = String(body || "").replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var buf = [];
    var inComment = false;

    function push(obj) {
      state.seq += 1;
      obj.id = "b" + state.seq;
      out.push(obj);
    }
    function flush() {
      var text = buf.join("\n").trim();
      buf = [];
      if (text) push({ type: "narration", name: "", text: text, src: "", alt: "" });
    }

    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var line = raw.trim();

      if (inComment) {
        if (line.indexOf("-->") >= 0) inComment = false;
        continue;
      }
      if (line.indexOf("<!--") === 0) {
        if (line.indexOf("-->") < 0) inComment = true;
        continue;
      }
      if (!line) { flush(); continue; }

      if (/^##\s+/.test(line)) {
        flush();
        push({ type: "title", name: "", text: line.replace(/^##\s+/, ""), src: "", alt: "" });
        continue;
      }
      if (/^#{1,6}\s+/.test(line)) {      // 其它级别标题当旁白
        flush();
        push({ type: "narration", name: "", text: line.replace(/^#{1,6}\s+/, ""), src: "", alt: "" });
        continue;
      }
      if (/^---+$/.test(line)) {
        flush();
        push({ type: "break", name: "", text: "", src: "", alt: "" });
        continue;
      }
      if (/^>\s?/.test(line)) {
        flush();
        var qtext = line.replace(/^>\s?/, "");
        var last = out[out.length - 1];
        if (last && last.type === "quote") last.text += "\n" + qtext;
        else push({ type: "quote", name: "", text: qtext, src: "", alt: "" });
        continue;
      }
      var m = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
      if (m) {
        flush();
        push({ type: "image", name: "", text: "", src: m[2], alt: m[1] });
        continue;
      }
      var sp = line.match(/^([^\s：:。！？!?，,、；;“”"'（）()]{1,10})[：:]\s*(.*)$/);
      if (sp) {
        flush();
        if (/^(旁白|叙述|解说|narrator)$/i.test(sp[1])) {
          push({ type: "narration", name: "", text: sp[2], src: "", alt: "" });
        } else {
          push({ type: "line", name: sp[1], text: sp[2], src: "", alt: "" });
        }
        continue;
      }
      buf.push(line);
    }
    flush();
    return out;
  }

  /* ---------------- 预览 ---------------- */
  function chatHtml() {
    var me = $("f-me").value.trim();
    var blocks = state.blocks;

    if (!blocks.length) {
      return '<div class="chat"><div class="chat-empty">还没有内容，先在左边写几句台词吧。</div></div>';
    }

    var html = '<div class="chat">';
    var last = null;

    blocks.forEach(function (b) {
      if (b.type === "title") {
        if (!b.text.trim()) return;
        html += '<div class="chat-divider"><span>' + escapeHtml(b.text.trim()) + '</span></div>';
        last = null;
      } else if (b.type === "break") {
        html += '<div class="chat-divider"><span>⁂</span></div>';
        last = null;
      } else if (b.type === "narration" || b.type === "quote") {
        if (!b.text.trim()) return;
        html += '<div class="chat-narration">' + inlineMd(b.text) + '</div>';
        last = null;
      } else if (b.type === "image") {
        if (!b.src.trim()) return;
        html += '<div class="chat-msg chat-them chat-image"><div class="chat-bubble">'
          + '<img src="' + escapeHtml(b.src.trim()) + '" alt="' + escapeHtml(b.alt || "") + '">'
          + '</div></div>';
        last = null;
      } else if (b.type === "line") {
        var name = (b.name || "").trim() || "我";
        var mine = (name === me) || (name === "我");
        var same = (last === name);
        var color = avatarColor(name);
        html += '<div class="chat-msg ' + (mine ? "chat-me" : "chat-them") + (same ? " chat-same" : "") + '">'
          + '<div class="chat-avatar" style="--c:' + color + '">' + escapeHtml(name.slice(0, 1)) + '</div>'
          + '<div class="chat-body">'
          + '<div class="chat-name">' + escapeHtml(name) + '</div>'
          + '<div class="chat-bubble">' + inlineMd(b.text) + '</div>'
          + '</div></div>';
        last = name;
      }
    });

    return html + "</div>";
  }

  var PALETTE = ["#e07a5f", "#3d7ea6", "#6a8f5f", "#a06cd5", "#c48a3f", "#4a7c94", "#b5546a", "#5d6bb0"];
  function avatarColor(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  function renderPreview() {
    var box = $("preview");
    if (state.mode === "dialogue") {
      box.innerHTML = chatHtml();
    } else {
      var text = editor ? editor.value() : "";
      var html;
      try {
        html = (typeof marked.parse === "function") ? marked.parse(text) : escapeHtml(text);
      } catch (e) {
        html = "<p style='color:#c00'>预览渲染出错：" + escapeHtml(e.message || String(e)) + "</p>";
      }
      box.innerHTML = html;
    }
  }

  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(renderPreview, 120);
  }

  /* ---------------- 模式 ---------------- */
  function currentBody() {
    return state.mode === "dialogue" ? blocksToMarkdown() : (editor ? editor.value() : "");
  }

  function setMode(mode, silent) {
    if (mode === state.mode) return;
    if (mode === "dialogue") {
      var body = editor ? editor.value() : "";
      state.blocks = markdownToBlocks(body);
      $("normal-mode").hidden = true;
      $("dialogue-mode").hidden = false;
      renderBlocks();
      if (!$("f-me").value && !silent) {
        var counts = {};
        state.blocks.forEach(function (b) {
          if (b.type === "line" && b.name) counts[b.name] = (counts[b.name] || 0) + 1;
        });
        var best = "";
        Object.keys(counts).forEach(function (k) { if (!best || counts[k] > counts[best]) best = k; });
        if (best) $("f-me").value = best;
      }
    } else {
      var md = blocksToMarkdown();
      $("dialogue-mode").hidden = true;
      $("normal-mode").hidden = false;
      if (editor) {
        editor.value(md);
        setTimeout(function () { editor.codemirror.refresh(); }, 0);
      }
    }
    state.mode = mode;
    document.querySelectorAll(".mode-btn").forEach(function (b) {
      b.classList.toggle("on", b.dataset.mode === mode);
    });
    renderPreview();
  }

  /* ---------------- 文章列表 ---------------- */
  function refreshList() {
    return api.list().then(function (posts) {
      var ul = $("post-list");
      ul.innerHTML = "";
      $("list-empty").style.display = posts.length ? "none" : "block";

      posts.forEach(function (p) {
        var li = document.createElement("li");
        li.dataset.filename = p.filename;
        if (p.filename === state.file) li.classList.add("active");

        var t = document.createElement("span");
        t.className = "t";
        t.textContent = p.title || p.filename;
        if (p.draft) {
          var bd = document.createElement("span");
          bd.className = "badge draft";
          bd.textContent = "草稿";
          t.appendChild(bd);
        }
        if (p.dialogue) {
          var bg = document.createElement("span");
          bg.className = "badge dlg";
          bg.textContent = "对话";
          t.appendChild(bg);
        }

        var m = document.createElement("span");
        m.className = "m";
        m.textContent = (p.date || "").slice(0, 10) + " · " + p.filename;

        li.appendChild(t);
        li.appendChild(m);
        li.addEventListener("click", function () { openPost(p.filename); });
        ul.appendChild(li);
      });
      return posts;
    });
  }

  function highlightActive() {
    document.querySelectorAll("#post-list li").forEach(function (li) {
      li.classList.toggle("active", li.dataset.filename === state.file);
    });
  }

  /* ---------------- 打开 / 新建 / 保存 ---------------- */
  function confirmDiscard() {
    if (!state.dirty) return true;
    return window.confirm("当前文章还有未保存的改动，确定要放弃吗？");
  }

  function applyPost(post) {
    state.file = post.filename;
    $("f-title").value = post.title || "";
    $("f-date").value = isoToLocalInput(post.date);
    $("f-tags").value = (post.tags || []).join(", ");
    $("f-draft").checked = !!post.draft;
    $("f-me").value = post.dialogueMe || "";
    state.dirty = false;

    var mode = post.dialogue ? "dialogue" : "normal";
    state.mode = mode;
    document.querySelectorAll(".mode-btn").forEach(function (b) {
      b.classList.toggle("on", b.dataset.mode === mode);
    });

    if (mode === "dialogue") {
      state.blocks = markdownToBlocks(post.body || "");
      $("normal-mode").hidden = true;
      $("dialogue-mode").hidden = false;
      renderBlocks();
      if (editor) editor.value(post.body || "");
    } else {
      $("dialogue-mode").hidden = true;
      $("normal-mode").hidden = false;
      if (editor) {
        editor.value(post.body || "");
        setTimeout(function () { editor.codemirror.refresh(); }, 0);
      }
    }
    renderPreview();
    highlightActive();
  }

  function openPost(filename) {
    if (!confirmDiscard()) return;
    api.get(filename).then(function (post) {
      applyPost(post);
      toast("已打开：" + post.filename);
    }).catch(function (err) { toast(err.message, true); });
  }

  function newPost() {
    if (!confirmDiscard()) return;
    state.file = null;
    state.blocks = [];
    $("f-title").value = "";
    $("f-date").value = nowLocalInput();
    $("f-tags").value = "";
    $("f-draft").checked = true;
    $("f-me").value = "";
    state.mode = "normal";
    document.querySelectorAll(".mode-btn").forEach(function (b) {
      b.classList.toggle("on", b.dataset.mode === "normal");
    });
    $("dialogue-mode").hidden = true;
    $("normal-mode").hidden = false;
    if (editor) {
      editor.value("");
      setTimeout(function () { editor.codemirror.refresh(); }, 0);
    }
    state.dirty = false;
    renderPreview();
    highlightActive();
    $("f-title").focus();
  }

  function collectPayload() {
    var dialogue = state.mode === "dialogue";
    return {
      title: $("f-title").value.trim(),
      date: $("f-date").value,
      tags: $("f-tags").value,
      draft: $("f-draft").checked,
      dialogue: dialogue,
      dialogueMe: dialogue ? $("f-me").value.trim() : "",
      body: currentBody()
    };
  }

  function savePost() {
    var payload = collectPayload();
    if (!payload.title) {
      toast("请先填写文章标题", true);
      $("f-title").focus();
      return;
    }
    var action = (state.file === null) ? api.create(payload) : api.save(state.file, payload);

    action.then(function (res) {
      state.file = res.filename;
      state.dirty = false;
      toast("已保存：" + res.filename);
      return refreshList();
    }).then(function () {
      highlightActive();
    }).catch(function (err) {
      toast(err.message, true);
    });
  }

  /* ---------------- 初始化 ---------------- */
  function loadTags() {
    api.tags().then(function (tags) {
      var dl = $("taglist");
      dl.innerHTML = "";
      tags.forEach(function (t) {
        var o = document.createElement("option");
        o.value = t;
        dl.appendChild(o);
      });
    }).catch(function () {});
  }

  function init() {
    editor = new EasyMDE({
      element: $("md"),
      autofocus: false,
      spellChecker: false,
      autoDownloadFontAwesome: false,
      status: ["lines", "words"],
      placeholder: "在这里写 Markdown 正文……",
      renderingConfig: { singleLineBreaks: false, codeSyntaxHighlighting: false },
      toolbar: [
        { name: "bold", action: EasyMDE.toggleBold, className: "tb", text: "B", title: "加粗 (Ctrl+B)" },
        { name: "italic", action: EasyMDE.toggleItalic, className: "tb", text: "I", title: "斜体 (Ctrl+I)" },
        { name: "heading", action: EasyMDE.toggleHeadingSmaller, className: "tb", text: "H", title: "标题" },
        "|",
        { name: "quote", action: EasyMDE.toggleBlockquote, className: "tb", text: "❝", title: "引用" },
        { name: "ul", action: EasyMDE.toggleUnorderedList, className: "tb", text: "•", title: "无序列表" },
        { name: "ol", action: EasyMDE.toggleOrderedList, className: "tb", text: "1.", title: "有序列表" },
        "|",
        { name: "link", action: EasyMDE.drawLink, className: "tb", text: "🔗", title: "链接" },
        { name: "image", action: EasyMDE.drawImage, className: "tb", text: "🖼", title: "图片" },
        { name: "code", action: EasyMDE.toggleCodeBlock, className: "tb", text: "</>", title: "代码块" },
        "|",
        { name: "undo", action: EasyMDE.undo, className: "tb", text: "↶", title: "撤销" },
        { name: "redo", action: EasyMDE.redo, className: "tb", text: "↷", title: "重做" },
        "|",
        { name: "fullscreen", action: EasyMDE.toggleFullScreen, className: "tb", text: "⛶", title: "全屏" }
      ]
    });

    editor.codemirror.on("change", function () {
      markDirty();
      schedulePreview();
    });

    // 顶栏
    $("btn-new").addEventListener("click", newPost);
    $("btn-save").addEventListener("click", savePost);
    $("btn-refresh").addEventListener("click", function () {
      refreshList().then(function () { toast("列表已刷新"); }).catch(function (e) { toast(e.message, true); });
    });

    document.querySelectorAll(".mode-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setMode(btn.dataset.mode);
        markDirty();
      });
    });

    document.querySelectorAll(".dlg-add button").forEach(function (btn) {
      btn.addEventListener("click", function () { addBlock(btn.dataset.add); });
    });

    $("f-me").addEventListener("input", function () { schedulePreview(); markDirty(); });

    $("toggle-preview").addEventListener("change", function (e) {
      document.body.classList.toggle("no-preview", !e.target.checked);
      if (e.target.checked) setTimeout(renderPreview, 0);
    });

    ["f-title", "f-date", "f-tags", "f-draft"].forEach(function (id) {
      $(id).addEventListener("input", markDirty);
      $(id).addEventListener("change", markDirty);
    });

    document.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
        e.preventDefault();
        savePost();
      }
    });

    window.addEventListener("beforeunload", function (e) {
      if (state.dirty) { e.preventDefault(); e.returnValue = ""; }
    });

    loadTags();
    refreshList().then(function (posts) {
      var want = new URLSearchParams(window.location.search).get("file");
      if (want && posts.some(function (p) { return p.filename === want; })) {
        openPost(want);
      } else if (posts.length > 0) {
        openPost(posts[0].filename);
      } else {
        newPost();
      }
    }).catch(function (err) {
      toast("读取文章列表失败：" + err.message, true);
      newPost();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
